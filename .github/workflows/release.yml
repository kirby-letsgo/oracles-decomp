name: release
# A change to VERSION reaching main (merging the PR that bumps it) builds the app for macOS, Windows,
# Linux and Android with that version and publishes them as the release v1.2.0, "Oracles 1.2.0",
# which becomes the latest: the apps' update check asks GitHub for it. When that release exists
# already, or the run was started by hand on a branch, it only builds (no version, nothing published).
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(tr -d ' \r\n' < VERSION)
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::VERSION must be MAJOR.MINOR.PATCH, not '$v'"; exit 1; fi
          publish=false
          if [ "$GITHUB_REF" = refs/heads/main ] && ! gh release view "v$v" > /dev/null 2>&1; then publish=true; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version $v, publish $publish"

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    needs: version
    env:
      ORACLES_VERSION: ${{ needs.version.outputs.publish == 'true' && needs.version.outputs.version || '' }}
    steps:
      - uses: actions/checkout@v5
      - run: brew install ninja
      - name: Build (universal)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DORACLES_SDL_VENDORED=ON -DORACLES_VERSION="$ORACLES_VERSION" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build --target oracles-native-app test_ui
          ./build/test_ui
      - name: Package
        run: |
          tools/make_dmg.sh build Oracles-macOS.dmg
          lipo -archs build/Oracles.app/Contents/MacOS/Oracles
      - uses: actions/upload-artifact@v7
        with: { name: macos, path: Oracles-macOS.dmg }

  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: version
    env:
      ORACLES_VERSION: ${{ needs.version.outputs.publish == 'true' && needs.version.outputs.version || '' }}
    steps:
      - uses: actions/checkout@v5
      - run: tools/apt_install.sh mingw-w64 ninja-build cmake
      - name: Build (x64, MinGW-w64)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DORACLES_SDL_VENDORED=ON -DORACLES_VERSION="$ORACLES_VERSION" \
            -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake
          cmake --build build --target oracles-native
      - name: Package
        run: |
          mkdir Oracles && cp build/Oracles.exe Oracles/
          zip -r Oracles-windows-x64.zip Oracles
      - uses: actions/upload-artifact@v7
        with: { name: windows, path: Oracles-windows-x64.zip }

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: version
    env:
      ORACLES_VERSION: ${{ needs.version.outputs.publish == 'true' && needs.version.outputs.version || '' }}
    steps:
      - uses: actions/checkout@v5
      - run: tools/linux_deps.sh
      - name: Build (x86_64)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DORACLES_SDL_VENDORED=ON -DORACLES_VERSION="$ORACLES_VERSION"
          cmake --build build --target oracles-native test_ui
          ./build/test_ui
      - name: Package (AppImage)
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          tools/apt_install.sh file
          curl -sSLo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp icon/oracles-256.png AppDir/usr/share/icons/hicolor/256x256/apps/oracles.png
          ./linuxdeploy --appdir AppDir --executable build/oracles-native \
            --desktop-file packaging/oracles.desktop --icon-file icon/oracles-256.png --output appimage
          mv Oracles-*.AppImage Oracles-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v7
        with: { name: linux, path: Oracles-linux-x86_64.AppImage }

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: version
    env:
      ORACLES_VERSION: ${{ needs.version.outputs.publish == 'true' && needs.version.outputs.version || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: SDK packages
        # The NDK download sometimes lands corrupt ("Error on ZipFile unknown archive"), so try a
        # few times, clearing the half-finished download in between. The output is kept in a file
        # and only printed when an attempt fails: discarding it leaves nothing in the log to go on.
        run: |
          for attempt in 1 2 3; do
            if yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                 "ndk;27.2.12479018" "cmake;3.31.6" "platforms;android-35" "build-tools;35.0.0" \
                 > "$RUNNER_TEMP/sdkmanager.log" 2>&1; then
              exit 0
            fi
            echo "::group::sdkmanager attempt $attempt failed"
            tail -40 "$RUNNER_TEMP/sdkmanager.log"
            echo "::endgroup::"
            rm -rf "$ANDROID_HOME/.downloadIntermediates"
            sleep 15
          done
          echo "::error::sdkmanager could not install the SDK packages"
          exit 1
      - name: Build (arm64)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ORACLES_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORACLES_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # this workflow's run number: it went up with every nightly too, so a release always
          # installs over whatever APK a phone has (Android refuses a lower versionCode)
          ORACLES_VERSION_CODE: ${{ github.run_number }}
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ORACLES_KEYSTORE="$RUNNER_TEMP/release.jks"
            ./gradlew assembleRelease --console=plain
            cp app/build/outputs/apk/release/app-release.apk ../Oracles-android.apk
          else
            echo "::warning::No release keystore in the secrets: publishing a debug-signed APK"
            ./gradlew assembleDebug --console=plain
            cp app/build/outputs/apk/debug/app-debug.apk ../Oracles-android.apk
          fi
      - uses: actions/upload-artifact@v7
        with: { name: android, path: Oracles-android.apk }

  publish:
    if: needs.version.outputs.publish == 'true'
    needs: [version, macos, windows, linux, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -la dist
          cat > notes.md <<EOF
          You need your own ROMs: The Legend of Zelda: Oracle of Ages and/or Oracle of Seasons (USA).
          The app opens on its launcher; ADD ROM there asks for one (a .zip or .gz is fine). It keeps
          the graphics, sound and data and never needs the ROM again.

          - **macOS** (Apple Silicon and Intel, 11+): open the DMG, drag Oracles out, then right-click > Open the first time (the app is not notarized).
          - **Windows** (64-bit): unzip and run Oracles.exe (SmartScreen: More info > Run anyway).
          - **Linux** (x86_64): \`chmod +x Oracles-linux-x86_64.AppImage\` and run it.
          - **Android** (8+, arm64): install the APK (allow installs from your browser or file manager).

          The app's main menu says when a newer version is out and links its download.
          EOF
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          if [ -n "$prev" ]; then
            printf '\n## Changes since %s\n\n' "$prev" >> notes.md
            git log --no-merges --format='- %s' "$prev..HEAD" >> notes.md
          fi
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --latest --title "Oracles $VERSION" --notes-file notes.md
